<template name="sitemap">
  <div class="sitemap-wrapper bg-gradient-to-br from-green-200 via-gray-100 to-orange-100 min-h-screen py-12 px-4">
    <div class="max-w-6xl mx-auto">
      <div class="text-center mb-12">
        <h1 class="text-4xl font-bold text-gray-800 mb-4">Site Map</h1>
        <p class="text-lg text-gray-600">Navigate through all pages of our website</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        
        <!-- Main Pages Section -->
        <div class="bg-white rounded-lg shadow-lg p-6">
          <h2 class="text-2xl font-semibold text-gray-800 mb-4 border-b-2 border-green-200 pb-2">
            <i class="fas fa-home mr-2"></i>Main Pages
          </h2>
          <ul class="space-y-3">
            <li><a href="{{pathFor 'homeIndex'}}" class="text-blue-600 hover:text-blue-800 transition-colors duration-200 flex items-center"><i class="fas fa-chevron-right mr-2 text-sm"></i>Home</a></li>
            <li><a href="{{pathFor 'brand'}}" class="text-blue-600 hover:text-blue-800 transition-colors duration-200 flex items-center"><i class="fas fa-chevron-right mr-2 text-sm"></i>Brand</a></li>
            <li><a href="{{pathFor 'invest'}}" class="text-blue-600 hover:text-blue-800 transition-colors duration-200 flex items-center"><i class="fas fa-chevron-right mr-2 text-sm"></i>Investment</a></li>
            <li><a href="{{pathFor 'contacts'}}" class="text-blue-600 hover:text-blue-800 transition-colors duration-200 flex items-center"><i class="fas fa-chevron-right mr-2 text-sm"></i>Contacts</a></li>
          </ul>
        </div>

        <!-- Blog & News Section -->
        <div class="bg-white rounded-lg shadow-lg p-6">
          <h2 class="text-2xl font-semibold text-gray-800 mb-4 border-b-2 border-blue-200 pb-2">
            <i class="fas fa-newspaper mr-2"></i>Blog & News
          </h2>
          <ul class="space-y-3">
            <li><a href="{{pathFor 'news'}}" class="text-blue-600 hover:text-blue-800 transition-colors duration-200 flex items-center"><i class="fas fa-chevron-right mr-2 text-sm"></i>All News</a></li>
            {{#each newsItems}}
            <li><a href="{{pathFor 'news'}}" class="text-blue-600 hover:text-blue-800 transition-colors duration-200 flex items-center text-sm"><i class="fas fa-dot-circle mr-2 text-xs"></i>{{title}}</a></li>
            {{/each}}
          </ul>
        </div>

        <!-- Projects Section -->
        <div class="bg-white rounded-lg shadow-lg p-6">
          <h2 class="text-2xl font-semibold text-gray-800 mb-4 border-b-2 border-orange-200 pb-2">
            <i class="fas fa-building mr-2"></i>Projects
          </h2>
          <ul class="space-y-3">
            {{#each projectItems}}
            <li>
              <a href="{{pathFor 'projects' sku=sku}}" class="text-blue-600 hover:text-blue-800 transition-colors duration-200 flex items-center">
                <i class="fas fa-chevron-right mr-2 text-sm"></i>{{name}}
              </a>
              <ul class="ml-6 mt-2 space-y-1">
                <li><a href="{{pathFor 'projectGallery' sku=sku}}" class="text-gray-600 hover:text-gray-800 transition-colors duration-200 flex items-center text-sm"><i class="fas fa-images mr-2 text-xs"></i>Gallery</a></li>
                <li><a href="{{pathFor 'mapProject' sku=sku}}" class="text-gray-600 hover:text-gray-800 transition-colors duration-200 flex items-center text-sm"><i class="fas fa-map-marker-alt mr-2 text-xs"></i>Location</a></li>
              </ul>
            </li>
            {{/each}}
          </ul>
        </div>

      </div>

      <!-- Additional Info Section -->
      <div class="mt-12 bg-white rounded-lg shadow-lg p-8">
        <div class="text-center">
          <h3 class="text-2xl font-semibold text-gray-800 mb-4">About Our Website</h3>
          <p class="text-gray-600 max-w-3xl mx-auto">
            Konak Construction has been delivering high-quality construction projects since 1971. 
            Browse through our portfolio of award-winning projects, latest news, and investment opportunities.
          </p>
          <div class="mt-6 flex justify-center space-x-4">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800">
              <i class="fas fa-check-circle mr-1"></i>
              {{projectCount}} Projects
            </span>
            <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800">
              <i class="fas fa-newspaper mr-1"></i>
              {{newsCount}} News Articles
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
